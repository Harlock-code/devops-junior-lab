global:

  # EN: Prometheus scrape interval
  # ES: Intervalo de recolección de métricas
  scrape_interval: 15s

scrape_configs:

  # EN: Monitor Prometheus itself
  # ES: Monitorizar el propio Prometheus
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # EN: Collect Linux host metrics
  # ES: Recoger métricas del host Linux
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
