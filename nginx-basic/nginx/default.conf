server {

    # EN: Nginx listening port
    # ES: Puerto de escucha de Nginx
    listen 80;

    location / {

        # EN: Forward requests to backend container
        # ES: Reenviar peticiones al contenedor backend
        proxy_pass http://backend:80;

        # EN: Preserve original client headers
        # ES: Mantener cabeceras originales del cliente
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
