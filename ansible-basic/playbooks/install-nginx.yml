# EN: Install and configure Nginx web server
# ES: Instalar y configurar servidor web Nginx

---
- name: Install and configure Nginx
  hosts: web
  become: true

  handlers:

    # EN: Restart Nginx when configuration changes
    # ES: Reiniciar Nginx cuando cambie la configuración
    - name: Restart Nginx
      service:
        name: nginx
        state: restarted

  tasks:

    # EN: Update apt package cache
    # ES: Actualizar caché de paquetes apt
    - name: Update apt cache
      apt:
        update_cache: true

    # EN: Install Nginx package
    # ES: Instalar paquete Nginx
    - name: Install Nginx
      apt:
        name: nginx
        state: present

    # EN: Deploy custom web page template
    # ES: Desplegar plantilla personalizada web
    - name: Deploy custom index page
      template:
        src: ../templates/index.html.j2
        dest: /var/www/html/index.html
      notify: Restart Nginx

    # EN: Ensure Nginx service is enabled and running
    # ES: Asegurar que Nginx esté habilitado y en ejecución
    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: true
