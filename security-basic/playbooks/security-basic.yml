---
- name: Basic Linux security hardening
  hosts: localhost
  become: true
  connection: local

  tasks:
    - name: Install security packages
      apt:
        name:
          - ufw
          - fail2ban
        state: present
        update_cache: true

    - name: Allow SSH
      ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS
      ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW
      ufw:
        state: enabled
        policy: deny

    - name: Ensure Fail2ban is enabled and running
      service:
        name: fail2ban
        state: started
        enabled: true
